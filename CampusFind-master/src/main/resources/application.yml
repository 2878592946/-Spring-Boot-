server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lostfound?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 🌟 新增：MyBatis-Plus 核心配置
mybatis-plus:
  # 映射所有自定义复杂 SQL 的 XML 位置
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启驼峰命名自动映射（如将数据库的 user_id 映射成 Java 的 userId）
    map-underline-to-camel-case: true
    # 答辩演示和调试神器：在控制台打印精美的 SQL 执行日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 🌟 对象存储配置（MinIO，S3 兼容），替代原本的本地磁盘存储
minio:
  endpoint: http://localhost:9000            # MinIO 服务地址
  access-key: minioadmin                      # 访问密钥（MinIO 默认）
  secret-key: minioadmin                      # 秘密密钥（MinIO 默认）
  bucket: lostfound                           # 存储桶名称，不存在会自动创建并设为公开读
  public-url: http://localhost:9000/lostfound # 图片对外访问前缀（公开读直链），返回给前端拼接用
# 🌟 自定义安全配置

secure:
  admin-key: gly  # 🔑 这就是你的管理员注册授权密钥，可以随便修改

# 🌟 JWT 无状态令牌配置
jwt:
  # HS256 签名密钥，长度需 >= 32 字节（256 位），生产环境请改为随机强密钥
  secret: campusfind-lostfound-jwt-secret-key-please-change-me-2026-05-2878592946
  # 令牌有效期（毫秒），默认 24 小时
  expiration: 86400000